name: agent-builder
version: 0.1.0
api_version: 1
description: Secure self-service Hermes profile registry, Dashboard UI, Slack/Telegram routers, and host CLI
homepage: https://github.com/grglzrv/hermes-agent-builder
license: MIT
tags: [agents, profiles, dashboard, telegram, slack, rbac, sqlite]
provides_tools:
  - agent_builder_list
  - agent_builder_get
  - agent_builder_catalogs
provides_hooks: []
python_dependencies:
  - "PyYAML>=6,<7"
config_schema:
  admins:
    type: list
    default: []
    description: Principal IDs that should be treated as Agent Builder administrators.
  allowed_models:
    type: list
    default: []
    description: Optional allowlist of model IDs or provider:model choices available to self-service agents.
  require_creation_approval:
    type: bool
    default: true
    description: Require host admin approval before created agents become active.
